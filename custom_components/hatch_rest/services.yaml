set_favorite:
  name: Set favorite
  description: >-
    Write to one of the six favorites stored on a Hatch Rest. Anything left
    out keeps the value the favorite already holds.
  target:
    entity:
      integration: hatch_rest
      domain: select
  fields:
    slot:
      name: Slot
      description: Which of the six favorites to write to.
      required: true
      selector:
        number:
          min: 1
          max: 6
          mode: box
    rgb_color:
      name: Color
      description: The color the favorite should light up.
      selector:
        color_rgb:
    brightness:
      name: Brightness
      description: How bright the light should be, from off to full.
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    sound:
      name: Sound
      description: Which sound the favorite should play.
      selector:
        select:
          options:
            - none
            - stream
            - noise
            - dryer
            - ocean
            - wind
            - rain
            - bird
            - crickets
            - brahms
            - twinkle
            - rockabye
    volume:
      name: Volume
      description: How loud that sound should be.
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    enabled:
      name: Enabled
      description: >-
        Whether the favorite is offered when cycling through them on the
        device itself.
      selector:
        boolean:

save_favorite:
  name: Save favorite
  description: >-
    Save whatever the Hatch Rest is playing right now into one of its six
    favorites. Set the light and sound how you want them first, then call
    this. Whether the favorite is offered on the device itself is left as it
    was.
  target:
    entity:
      integration: hatch_rest
      domain: select
  fields:
    slot:
      name: Slot
      description: Which of the six favorites to overwrite.
      required: true
      selector:
        number:
          min: 1
          max: 6
          mode: box

set_sleep_timer:
  name: Set sleep timer
  description: >-
    Start the Hatch Rest's sleep timer for an exact duration, after which it
    switches itself off. A duration of zero cancels a running timer. Replaces
    any timer already running, including one started from the app.
  target:
    entity:
      integration: hatch_rest
      domain: select
  fields:
    duration:
      name: Duration
      description: How long until the Hatch Rest switches off, up to 18:12:15.
      required: true
      selector:
        duration:
